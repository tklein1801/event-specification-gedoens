services:
  web:
    image: ghcr.io/tklein1801/esg-webapp${WEBAPP_TAG:-:latest}
    restart: unless-stopped
    ports:
      - "${WEBAPP_BIND_ADDRESS:-127.0.0.1}:${WEBAPP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
