services:
  web:
    image: ghcr.io/tklein1801/event-specification-gedoens:${IMAGE_TAG:-latest}
    ports:
      - '${WEB_PORT:-8080}:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
