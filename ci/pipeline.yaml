groups:
  - name: all
    jobs:
      - '*'
  - name: build
    jobs:
      - build
  - name: deploy
    jobs:
      - deploy
  - name: release
    jobs:
      - release-*
  - name: pull-request
    jobs:
      - pr-checks
      - auto-merge-dependabot
  - name: maintenance
    jobs:
      - update-dependencies
resource_types:
  - name: pull-request
    type: registry-image
    source:
      repository: cfcommunity/github-pr-resource
      tag: latest
  - name: cogito
    type: registry-image
    check_every: 24h
    source:
      repository: pix4d/cogito
      tag: '0.17.3'
  - name: npm
    type: registry-image
    check_every: 24h
    source:
      repository: timotto/concourse-npm-resource
  - name: ssh-scp
    type: registry-image
    source:
      repository: ghcr.io/tklein1801/concourse-ssh-scp-resource
resources:
  - name: repository
    type: git
    icon: git
    source:
      uri: git@github.com:((repository.owner))/((repository.name)).git
      branch: ((repository.branch))
      private_key: ((github.private_key))
  - name: gh-commit-status
    type: cogito
    icon: github
    check_every: never
    source:
      owner: ((repository.owner))
      repo: ((repository.name))
      access_token: ((github.pat))
  - name: pull-request
    type: pull-request
    icon: github
    source:
      repository: ((repository.owner))/((repository.name))
      access_token: ((github.pat))
      base_branch: ((pull-request.target-branch))
  - name: version
    type: semver
    icon: tag
    check_every: never
    source:
      driver: git
      uri: git@github.com:((repository.owner))/((repository.name)).git
      branch: version
      file: version
      private_key: ((github.private_key))
      git_user: ((git.name)) <((git.email))>
      initial_version: 1.3.1
  - name: github-release
    type: github-release
    icon: github
    source:
      owner: ((repository.owner))
      repository: ((repository.name))
      access_token: ((github.pat))
  - name: cli-npm-release
    type: npm
    icon: npm
    source:
      package: '@tklein1801/esg-cli'
      registry:
        token: ((npm.token))
  - name: mcp-npm-release
    type: npm
    icon: npm
    source:
      package: '@tklein1801/esg-mcp'
      registry:
        token: ((npm.token))
  - name: webapp-docker-release
    type: docker-image
    icon: docker
    source:
      repository: ghcr.io/((repository.owner))/esg-webapp
      username: ((docker.username))
      password: ((docker.password))
  - name: timer
    type: time
    icon: clock-outline
    source:
      interval: ((dependency-update.interval))
  - name: server-target
    type: ssh-scp
    icon: server
    check_every: never
    source:
      user: ((deployment-vps1.ssh_username))
      host: ((deployment-vps1.host))
      known_hosts: |
        ((deployment-vps1.known_hosts))
      private_key: |
        ((deployment-vps1.ssh_private_key))
jobs:
  - name: build
    public: true
    serial_groups: [release]
    on_success:
      put: gh-commit-status
      inputs: [repository]
      params: { state: success }
    on_failure:
      put: gh-commit-status
      inputs: [repository]
      params: { state: failure }
    on_error:
      put: gh-commit-status
      inputs: [repository]
      params: { state: error }
    on_abort:
      put: gh-commit-status
      inputs: [repository]
      params: { state: abort }
    plan:
      - in_parallel:
          - get: repository
            trigger: true
          - get: version
            params: { pre: rc }
      - put: gh-commit-status
        inputs: [repository]
        params: { state: pending }
      - task: build
        file: repository/ci/tasks/build.task.yaml
      - task: validate-docker-image
        privileged: true
        file: repository/ci/tasks/validate-docker-image.task.yaml
      - put: webapp-docker-release
        get_params: { skip_download: true }
        params:
          build: repository
          dockerfile: repository/apps/webapp/Dockerfile
          tag_file: repository/.git/short_ref
          tag_as_latest: false
      - put: version
        params: { file: version/version }
  - name: deploy
    serial: true
    plan:
      - in_parallel:
          - get: repository
            passed: [build]
          - get: webapp-docker-release
            passed: [build]
            params: { skip_download: true }
      - task: deploy
        file: repository/ci/tasks/deploy.task.yaml
        input_mapping:
          container-registry: webapp-docker-release
        params:
          DEPLOY_PATH: ((deployment.path))
          REGISTRY_USERNAME: ((docker.username))
          REGISTRY_PASSWORD: ((docker.password))
      - load_var: deploy-image
        file: deploy-files/image-ref
        format: trim
      - put: server-target
        inputs: []
        no_get: true
        params:
          commands:
            - "mkdir -p -- '((deployment.path))' && umask 077 && mkdir -- '((deployment.path))/.registry-credentials'"
      - do:
          - put: server-target
            inputs: [deploy-files, registry-credentials]
            no_get: true
            params:
              files:
                'deploy-files/compose.next.yml': '((deployment.path))/compose.next.yml'
                'deploy-files/deploy.next.sh': '((deployment.path))/deploy.next.sh'
                'registry-credentials/username': '((deployment.path))/.registry-credentials/username'
                'registry-credentials/password': '((deployment.path))/.registry-credentials/password'
              commands:
                - "sh '((deployment.path))/deploy.next.sh' '((deployment.path))' '((.:deploy-image))'"
        ensure:
          put: server-target
          inputs: []
          no_get: true
          params:
            commands:
              - "rm -f -- '((deployment.path))/.registry-credentials/username' '((deployment.path))/.registry-credentials/password' && if [ -d '((deployment.path))/.registry-credentials' ]; then rmdir -- '((deployment.path))/.registry-credentials'; fi"
  - name: release-patch
    public: false
    serial_groups: [release]
    plan:
      - in_parallel:
          - get: version
            params: { bump: patch }
          - get: repository
            passed: [build]
      - task: build
        file: repository/ci/tasks/build.task.yaml
      - in_parallel:
          - put: version
            params: { file: version/version }
          - put: github-release
            params:
              name: version/version
              tag: version/version
          - put: cli-npm-release
            params:
              path: repository/packages/cli
              public: 'true'
          - put: mcp-npm-release
            params:
              path: repository/apps/mcp
              public: 'true'
          - put: webapp-docker-release
            get_params: { skip_download: true }
            params:
              build: repository
              dockerfile: repository/apps/webapp/Dockerfile
              tag_file: version/version
              tag_as_latest: true
  - name: release-minor
    public: false
    serial_groups: [release]
    plan:
      - in_parallel:
          - get: version
            params: { bump: minor }
          - get: repository
            passed: [build]
      - task: build
        file: repository/ci/tasks/build.task.yaml
      - in_parallel:
          - put: version
            params: { file: version/version }
          - put: github-release
            params:
              name: version/version
              tag: version/version
          - put: cli-npm-release
            params:
              path: repository/packages/cli
              public: 'true'
          - put: mcp-npm-release
            params:
              path: repository/apps/mcp
              public: 'true'
          - put: webapp-docker-release
            get_params: { skip_download: true }
            params:
              build: repository
              dockerfile: repository/apps/webapp/Dockerfile
              tag_file: version/version
              tag_as_latest: true
  - name: release-major
    public: false
    serial_groups: [release]
    plan:
      - in_parallel:
          - get: version
            params: { bump: major }
          - get: repository
            passed: [build]
      - task: build
        file: repository/ci/tasks/build.task.yaml
      - in_parallel:
          - put: version
            params: { file: version/version }
          - put: github-release
            params:
              name: version/version
              tag: version/version
          - put: cli-npm-release
            params:
              path: repository/packages/cli
              public: 'true'
          - put: mcp-npm-release
            params:
              path: repository/apps/mcp
              public: 'true'
          - put: webapp-docker-release
            get_params: { skip_download: true }
            params:
              build: repository
              dockerfile: repository/apps/webapp/Dockerfile
              tag_file: version/version
              tag_as_latest: true
  - name: pr-checks
    public: true
    on_failure:
      put: pull-request
      params: { path: pull-request, status: error }
    on_error:
      put: pull-request
      params: { path: pull-request, status: error }
    plan:
      - in_parallel:
          - get: repository
          - get: pull-request
            trigger: true
            version: every # check back into this value
      - put: pull-request
        params: { path: pull-request, status: pending }
      - task: build-pr
        file: repository/ci/tasks/build.task.yaml
        input_mapping:
          repository: pull-request
        params:
          PREPARE_RELEASE: 'false'
      - put: pull-request
        params: { path: pull-request, status: success }
  - name: auto-merge-dependabot
    public: true
    plan:
      - get: repository
      - get: pull-request
        trigger: true
        passed: [pr-checks]
        version: every
      - task: enable-auto-merge
        file: repository/ci/tasks/auto-merge-dependabot.task.yaml
        params:
          GH_TOKEN: ((github.pat))
          GITHUB_REPOSITORY: ((repository.owner))/((repository.name))
  - name: update-dependencies
    public: true
    plan:
      - in_parallel:
          - get: repository
          - get: timer
            trigger: true
      - task: npm-update
        file: repository/ci/tasks/update-deps.task.yaml
        vars:
          git_user_name: ((git.name))
          git_user_email: ((git.email))
        on_success:
          put: repository
          params:
            repository: repository
