platform: linux
image_resource:
  type: registry-image
  source:
    repository: node
    tag: alpine
inputs:
  - name: repository
outputs:
  - name: repository
caches:
  - path: node_modules
params:
  CI: 'true'
  HUSKY: '0'
  FORCE_COLOR: 1
  NPM_CONFIG_FUND: 'false'
  GIT_AUTHOR_NAME: '((git_user_name))'
  GIT_AUTHOR_EMAIL: '((git_user_email))'
  GIT_COMMITTER_NAME: '((git_user_name))'
  GIT_COMMITTER_EMAIL: '((git_user_email))'
run:
  path: sh
  dir: repository
  args:
    - -ecx
    - |
      apk add --no-cache --no-progress git
      npm ci
      npm update --workspaces --include-workspace-root
      npm audit fix
      npm run lint
      npm run test
      npm run build
      git add package.json package-lock.json ':(glob)apps/*/package.json' ':(glob)packages/*/package.json'
      if git diff --cached --quiet; then
        echo 'No dependency changes to commit.'
      else
        status=$?
        [ "$status" -eq 1 ] || exit "$status"
        git commit -m 'chore: update npm dependencies'
      fi
