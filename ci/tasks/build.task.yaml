platform: linux
image_resource:
  type: registry-image
  source:
    repository: node
    tag: alpine
inputs:
  - name: repository
outputs:
  - name: repository
  - name: version
caches:
  - path: node_modules
params:
  CI: 'true'
  FORCE_COLOR: 1
  NPM_CONFIG_FUND: 'false'
run:
  path: sh
  dir: repository
  args:
    - -ecx
    - |
      NEW_VERSION="$(cat version/version)"
      npm ci
      npm test
      npm run build

      echo "\nPublishing version $NEW_VERSION"
      echo "CLI"
      cd packages/cli
      npm version "$(cat ../version/version)" --no-git-tag-version
      npm publish --access public --tag latest --dry-run

      echo "MCP"
      cd apps/mcp
      npm version "$(cat ../version/version)" --no-git-tag-version
      npm publish --access public --tag latest --dry-run
